<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Card Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
/* Layout: one column phone app, sticky header with two tabs, full-screen camera overlay */
:root{
  --bg:#f3f4f8; --card:#ffffff; --fg:#1b1f33; --muted:#646a85; --line:#dfe2ec;
  --accent:#2f5bd3; --accent-fg:#fff; --gold:#b8860b; --bad:#c0392b;
  --display:"Space Grotesk",system-ui,sans-serif; --body:Inter,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141f; --card:#1c1f2e; --fg:#e8eaf3; --muted:#9aa0bb; --line:#2c3044;
  --accent:#7d9cff; --accent-fg:#0c1020; --gold:#e6b84a; --bad:#ff7b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141f; --card:#1c1f2e; --fg:#e8eaf3; --muted:#9aa0bb; --line:#2c3044;
  --accent:#7d9cff; --accent-fg:#0c1020; --gold:#e6b84a; --bad:#ff7b6b; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);
  padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
h1{font:700 20px var(--display);margin:0 0 8px}
nav{display:flex;gap:4px}
nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);
  font:600 15px var(--body);padding:10px 0;cursor:pointer}
nav button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
main{padding:16px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  max-width:640px;margin:0 auto;display:grid;gap:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-fg);
  border:0;border-radius:12px;font:600 16px var(--body);padding:14px;cursor:pointer;width:100%}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.btn.small{width:auto;padding:8px 12px;font-size:14px;border-radius:9px}
.link{background:none;border:0;color:var(--accent);font:600 14px var(--body);cursor:pointer;text-align:center;padding:4px}
button:focus-visible,input:focus-visible,label:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
input[type=search]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--fg);font:15px var(--body)}
#preview{max-height:220px;border-radius:12px;display:block;margin:0 auto}
#status{color:var(--muted);text-align:center;min-height:1.4em;margin:0}
.hint{color:var(--muted);font-size:13px;margin:0;text-align:center}
.item{display:grid;grid-template-columns:64px 1fr;gap:12px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:10px}
.item img{width:64px;border-radius:5px}
.item h3{font:700 16px var(--display);margin:0}
.meta{color:var(--muted);font-size:13px}
.variants{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.price{font-variant-numeric:tabular-nums;font-weight:600}
.eur{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.total{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
  display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.total b{font:700 28px var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;gap:6px;margin-top:6px}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);
  color:var(--fg);font-size:18px;cursor:pointer}
.qty .del{width:auto;padding:0 10px;font-size:13px;color:var(--bad);margin-left:auto}
.empty{text-align:center;color:var(--muted);padding:32px 8px}
a{color:var(--accent)}
/* camera overlay: always dark, it shows a live camera */
#cam{position:fixed;inset:0;z-index:20;background:#000;overflow:hidden}
#video{width:100%;height:100%;object-fit:cover;display:block}
#guide{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
  width:min(74vw,50vh);aspect-ratio:63/88;border:3px solid #fff;border-radius:16px;
  box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
#guide::after{content:"";position:absolute;left:-3px;right:-3px;bottom:-3px;height:20%;
  border:3px dashed #ffd84a;border-radius:0 0 16px 16px}
#guide.hit{border-color:#5be07a}
#camStatus{position:absolute;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));
  margin:0;color:#fff;text-align:center;font:600 16px var(--body);text-shadow:0 1px 3px #000}
#camClose{position:absolute;left:50%;transform:translateX(-50%);width:auto;padding:12px 28px;
  bottom:calc(28px + env(safe-area-inset-bottom,0px));background:#fff;color:#111;border:0}
</style>
</head>
<body>
<header>
  <h1>Card Vault</h1>
  <nav role="tablist">
    <button id="tab-scan" role="tab" aria-selected="true">Scan</button>
    <button id="tab-col" role="tab" aria-selected="false">Collection <span id="count"></span></button>
  </nav>
</header>

<main id="view-scan">
  <button class="btn" id="scan">📷 Scan a card</button>
  <label class="link" for="photo">Use a photo instead</label>
  <input id="photo" type="file" accept="image/*" capture="environment" hidden>
  <img id="preview" alt="" hidden>
  <p id="status" aria-live="polite"></p>
  <form id="search" class="row">
    <input id="q" type="search" placeholder="Or type: Pikachu  or  25/165" autocomplete="off">
    <button class="btn small" style="flex:0 0 auto">Find</button>
  </form>
  <div id="results" style="display:grid;gap:10px"></div>
</main>

<main id="view-col" hidden>
  <div class="total">
    <div><div class="meta">Collection value (TCGplayer market)</div><b id="sum-usd">$0.00</b></div>
    <div class="eur" id="sum-eur"></div>
  </div>
  <div class="row">
    <button class="btn ghost small" id="refresh">↻ Update prices</button>
    <button class="btn ghost small" id="export">Save backup</button>
    <label class="btn ghost small" for="import">Load backup</label>
    <input id="import" type="file" accept="application/json,.json" hidden>
  </div>
  <div id="list" style="display:grid;gap:10px"></div>
</main>

<div id="cam" hidden>
  <video id="video" playsinline muted autoplay></video>
  <div id="guide"></div>
  <p id="camStatus" aria-live="polite"></p>
  <button id="camClose" class="btn">Cancel</button>
</div>

<script>
// Two free price sources. TCGdex first (fresh prices, stable), pokemontcg.io as backup.
const DEX = 'https://api.tcgdex.net/v2/en';
const PTCG = 'https://api.pokemontcg.io/v2/cards';
const PTCG_FIELDS = 'id,name,number,set,images,tcgplayer,cardmarket';
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const usd = n => n == null ? '–' : '$' + n.toFixed(2);
const eur = n => n == null ? '–' : '€' + n.toFixed(2);
const pretty = k => k.replace(/-/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2').replace(/^./, c => c.toUpperCase());
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip0 = n => /^\d+$/.test(n) ? String(+n) : n;

// ---------- storage (on this phone) ----------
let col = [];
try { col = JSON.parse(localStorage.getItem('vault') || '[]'); } catch {}
function save() {
  try { localStorage.setItem('vault', JSON.stringify(col)); } catch { alert('Could not save. Is private mode on?'); }
  renderCol();
}

// ---------- network: timeout + retry, 404 = null ----------
async function getJSON(url, tries = 3) {
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(url, { signal: AbortSignal.timeout(10000) });
      if (r.ok) return await r.json();
      if (r.status === 404) return null;
      if (r.status < 500 && r.status !== 429) throw new Error('HTTP ' + r.status);
    } catch (e) { if (String(e.message).startsWith('HTTP')) throw e; }
    if (i < tries - 1) await sleep(800 * (i + 1));
  }
  throw new Error('no answer from ' + new URL(url).host);
}

// ---------- both sources -> one card shape ----------
// {src, id, name, set, no, img, variants:[{v, usd, eur}]}
function fromDex(c) {
  const tp = c.pricing?.tcgplayer || {}, cm = c.pricing?.cardmarket || {};
  const eurFor = k => (/reverse/.test(k) ? cm['trend-holo'] : cm.trend) || cm.avg || null;
  const keys = Object.keys(tp).filter(k => tp[k] && typeof tp[k] === 'object');
  return { src: 'dex', id: c.id, name: c.name, set: c.set.name,
    no: c.set.cardCount?.official ? `${c.localId}/${c.set.cardCount.official}` : c.localId,
    img: c.image ? c.image + '/low.webp' : '',
    variants: keys.length
      ? keys.map(k => ({ v: k, usd: tp[k].marketPrice ?? tp[k].midPrice ?? null, eur: eurFor(k) }))
      : [{ v: 'normal', usd: null, eur: eurFor('normal') }] };
}
function fromPtcg(c) {
  const tp = c.tcgplayer?.prices || {}, cm = c.cardmarket?.prices || {};
  const eurFor = k => (/reverse/i.test(k) ? cm.reverseHoloTrend : cm.trendPrice) || null;
  const keys = Object.keys(tp);
  return { src: 'ptcg', id: c.id, name: c.name, set: c.set.name,
    no: c.set.printedTotal ? `${c.number}/${c.set.printedTotal}` : c.number,
    img: c.images.small,
    variants: keys.length
      ? keys.map(k => ({ v: k, usd: tp[k].market ?? tp[k].mid ?? null, eur: eurFor(k) }))
      : [{ v: 'normal', usd: null, eur: eurFor('normal') }] };
}

const dexFull = async ids => (await Promise.all(ids.map(id => getJSON(`${DEX}/cards/${encodeURIComponent(id)}`).catch(() => null))))
  .filter(Boolean).map(fromDex);
const ptcgSearch = async (q, size = 30) =>
  (await getJSON(`${PTCG}?q=${encodeURIComponent(q)}&pageSize=${size}&orderBy=-set.releaseDate&select=${PTCG_FIELDS}`)).data.map(fromPtcg);

async function dexByNum(p) {
  if (/^\d+$/.test(p.num) && /^\d+$/.test(p.total)) {
    const sets = await getJSON(`${DEX}/sets?cardCount.official=eq:${+p.total}`) || [];
    const cards = await Promise.all(sets.map(s => getJSON(`${DEX}/sets/${s.id}/${strip0(p.num)}`).catch(() => null)));
    return cards.filter(Boolean).map(fromDex);
  }
  const brief = await getJSON(`${DEX}/cards?localId=eq:${encodeURIComponent(p.num)}`) || [];
  return dexFull(brief.slice(0, 12).map(c => c.id));
}
async function dexByName(t) {
  const brief = await getJSON(`${DEX}/cards?name=${encodeURIComponent(t)}&pagination:itemsPerPage=12`) || [];
  return dexFull(brief.map(c => c.id));
}
function ptcgNumQuery(p) {
  let q = `number:"${strip0(p.num)}"`;
  if (/^\d+$/.test(p.total)) q += ` set.printedTotal:${+p.total}`;
  return q;
}

// Try TCGdex; if it fails or finds nothing, try pokemontcg.io.
async function lookup(dexFn, ptcgQ) {
  let dexErr;
  try { const r = await dexFn(); if (r.length) return r; } catch (e) { dexErr = e; }
  try { return await ptcgSearch(ptcgQ); }
  catch (e) { if (dexErr) throw new Error('Both price sites are not answering. Try again in a minute.'); return []; }
}
const findByNum = p => lookup(() => dexByNum(p), ptcgNumQuery(p));
const findByName = t => lookup(() => dexByName(t), `name:"${t}*"`);

// ---------- card number parsing ----------
// "025/165" -> {num:"025", total:"165"}; also "TG05/TG30", "SV049/SV122"
function parseNum(text) {
  const m = text.toUpperCase().match(/([A-Z]{0,3}\d{1,3})\s*\/\s*([A-Z]{0,3}\d{2,3})/);
  return m ? { num: m[1], total: m[2] } : null;
}

// ---------- OCR ----------
let worker;
async function getWorker() {
  if (!worker) {
    worker = await Tesseract.createWorker('eng');
    await worker.setParameters({ tessedit_char_whitelist: '0123456789/ABCDEFGHIJKLMNOPQRSTUVWXYZ ' });
  }
  return worker;
}
// crop a region, make it big and high-contrast, read text
async function readRegion(src, sx, sy, sw, sh) {
  const scale = Math.min(3, 1800 / sw);
  const c = document.createElement('canvas');
  c.width = sw * scale; c.height = sh * scale;
  const ctx = c.getContext('2d');
  ctx.filter = 'grayscale(1) contrast(1.8)';
  ctx.drawImage(src, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return (await (await getWorker()).recognize(c)).data.text;
}

// ---------- live camera scan ----------
let stream = null, scanning = false;
const camStatus = t => $('#camStatus').textContent = t;

// bottom part of the on-screen frame, mapped to video pixels (video uses object-fit: cover)
function stripRect() {
  const v = $('#video'), e = v.getBoundingClientRect(), g = $('#guide').getBoundingClientRect();
  const vw = v.videoWidth, vh = v.videoHeight;
  if (!vw) return null;
  const s = Math.max(e.width / vw, e.height / vh);
  const dx = (e.width - vw * s) / 2, dy = (e.height - vh * s) / 2;
  // generous margins: people never line the card up exactly
  const x0 = Math.max(0, (g.left - g.width * 0.12 - e.left - dx) / s);
  const x1 = Math.min(vw, (g.right + g.width * 0.12 - e.left - dx) / s);
  const y0 = Math.max(0, (g.bottom - g.height * 0.25 - e.top - dy) / s);
  const y1 = Math.min(vh, (g.bottom + g.height * 0.12 - e.top - dy) / s);
  return [x0, y0, x1 - x0, y1 - y0];
}

async function startCam() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false,
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } });
  } catch {
    return status('Camera not allowed. Allow camera for this site, or tap "Use a photo instead".');
  }
  try { await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch {}
  const v = $('#video');
  v.srcObject = stream;
  $('#cam').hidden = false; $('#guide').classList.remove('hit');
  $('#results').innerHTML = ''; $('#preview').hidden = true; status('');
  await v.play().catch(() => {});
  scanning = true;
  camStatus('Getting ready…');
  await getWorker();
  let last = null;
  const misses = new Set();
  camStatus('Put the card in the frame. Number in the yellow part.');
  while (scanning) {
    const r = stripRect();
    if (!r) { await sleep(200); continue; }
    const p = parseNum(await readRegion(v, ...r));
    if (!scanning) break;
    const k = p && `${p.num}/${p.total}`;
    if (!k || misses.has(k)) { last = null; await sleep(100); continue; }
    if (k !== last) { last = k; camStatus(`Reading ${k}…`); continue; } // need the same number twice in a row
    camStatus(`Found ${k}. Getting price…`);
    $('#guide').classList.add('hit');
    try {
      const cards = await findByNum(p);
      if (!scanning) break;
      if (cards.length) { stopCam(); $('#q').value = k; showResults(cards); return; }
      misses.add(k); camStatus(`No card ${k}. Keep holding still…`);
    } catch (e) { camStatus(e.message); await sleep(1500); }
    $('#guide').classList.remove('hit');
    last = null;
  }
}
function stopCam() {
  scanning = false;
  stream?.getTracks().forEach(t => t.stop());
  stream = null;
  $('#video').srcObject = null;
  $('#cam').hidden = true;
}
$('#scan').onclick = startCam;
$('#camClose').onclick = stopCam;
document.addEventListener('visibilitychange', () => { if (document.hidden && scanning) stopCam(); });

// ---------- photo fallback ----------
$('#photo').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  $('#preview').src = URL.createObjectURL(f); $('#preview').hidden = false;
  $('#results').innerHTML = '';
  try {
    const img = await createImageBitmap(f);
    status('Reading the card number…');
    const h = Math.round(img.height * 0.15);
    let p = parseNum(await readRegion(img, 0, img.height - h, img.width, h));
    if (!p) { status('Looking harder…'); p = parseNum(await readRegion(img, 0, 0, img.width, img.height)); }
    if (!p) return status('Could not read the number. Try again, or type it below.');
    $('#q').value = `${p.num}/${p.total}`;
    status(`Found ${p.num}/${p.total}. Getting price…`);
    showResults(await findByNum(p));
  } catch (err) { status('Error: ' + err.message); }
};

// ---------- typed search ----------
$('#search').onsubmit = async e => {
  e.preventDefault();
  const t = $('#q').value.trim().replace(/"/g, '');
  if (!t) return;
  $('#results').innerHTML = '';
  status('Searching…');
  try {
    const p = parseNum(t);
    showResults(p ? await findByNum(p) : await findByName(t));
  } catch (err) { status('Error: ' + err.message); }
};

function status(t) { $('#status').textContent = t; }

// ---------- results ----------
let shown = [];
function showResults(cards) {
  shown = cards;
  status(cards.length ? (cards.length > 1 ? 'Tap the version that matches your card:' : 'Tap your version to add it:') : 'No card found. Check the number and try again.');
  $('#results').innerHTML = cards.map((c, i) => `<div class="item"><img src="${esc(c.img)}" alt="" loading="lazy">
    <div><h3>${esc(c.name)}</h3>
    <div class="meta">${esc(c.set)} · ${esc(c.no)}</div>
    <div class="variants">${c.variants.map((x, j) =>
      `<button class="btn small" data-i="${i}" data-j="${j}">+ ${esc(pretty(x.v))} <span class="price">${x.usd != null ? usd(x.usd) : eur(x.eur)}</span></button>`).join('')}</div>
    </div></div>`).join('');
}

$('#results').onclick = e => {
  const b = e.target.closest('button[data-i]'); if (!b) return;
  const c = shown[b.dataset.i], x = c.variants[b.dataset.j], key = `${c.src}:${c.id}|${x.v}`;
  const have = col.find(it => it.key === key);
  if (have) have.qty++;
  else col.push({ key, src: c.src, id: c.id, variant: x.v, name: c.name, set: c.set, num: c.no,
    img: c.img, qty: 1, usd: x.usd, eur: x.eur });
  save();
  status(`Added ${c.name} (${pretty(x.v)}). Scan the next one!`);
  b.textContent = '✓ Added';
};

// ---------- collection ----------
function renderCol() {
  const n = col.reduce((s, x) => s + x.qty, 0);
  $('#count').textContent = n ? `(${n})` : '';
  $('#sum-usd').textContent = usd(col.reduce((s, x) => s + (x.usd || 0) * x.qty, 0));
  $('#sum-eur').textContent = 'Cardmarket ' + eur(col.reduce((s, x) => s + (x.eur || 0) * x.qty, 0));
  const sorted = [...col].sort((a, b) => (b.usd || 0) - (a.usd || 0));
  $('#list').innerHTML = sorted.length ? sorted.map(x => `<div class="item"><img src="${esc(x.img)}" alt="" loading="lazy">
    <div><h3>${esc(x.name)}</h3>
    <div class="meta">${esc(x.set)} · ${esc(x.num)} · ${esc(pretty(x.variant))}</div>
    <div><span class="price">${usd(x.usd)}</span> <span class="eur">· ${eur(x.eur)}</span></div>
    <div class="qty"><button data-k="${esc(x.key)}" data-d="-1" aria-label="One less">−</button>
      <span class="price">×${x.qty}</span>
      <button data-k="${esc(x.key)}" data-d="1" aria-label="One more">+</button>
      <button class="del" data-k="${esc(x.key)}" data-d="del">Remove</button></div></div></div>`).join('')
    : '<p class="empty">No cards yet. Go to Scan and add your first card.</p>';
}

let armed = null; // tap Remove twice to delete
$('#list').onclick = e => {
  const b = e.target.closest('button[data-k]'); if (!b) return;
  const x = col.find(c => c.key === b.dataset.k); if (!x) return;
  if (b.dataset.d === 'del') {
    if (armed !== x.key) { armed = x.key; b.textContent = 'Tap again to remove'; return; }
    col = col.filter(c => c !== x);
  } else {
    x.qty = Math.max(1, x.qty + +b.dataset.d);
  }
  armed = null; save();
};

$('#refresh').onclick = async () => {
  const b = $('#refresh'); b.disabled = true;
  const srcOf = x => x.src || 'ptcg'; // cards saved by the first version have no src
  const apply = cards => { for (const c of cards) for (const x of col) {
    if (x.id !== c.id || srcOf(x) !== c.src) continue;
    const v = c.variants.find(v => v.v === x.variant);
    if (v) { x.usd = v.usd; x.eur = v.eur; }
  } };
  let failed = 0;
  try {
    const dexIds = [...new Set(col.filter(x => srcOf(x) === 'dex').map(x => x.id))];
    const ptcgIds = [...new Set(col.filter(x => srcOf(x) === 'ptcg').map(x => x.id))];
    const all = dexIds.length + ptcgIds.length;
    for (let i = 0; i < dexIds.length; i += 6) {
      b.textContent = `Updating ${i}/${all}…`;
      const part = dexIds.slice(i, i + 6), got = await dexFull(part);
      failed += part.length - got.length; apply(got);
    }
    for (let i = 0; i < ptcgIds.length; i += 25) {
      b.textContent = `Updating ${dexIds.length + i}/${all}…`;
      try { apply(await ptcgSearch(ptcgIds.slice(i, i + 25).map(id => `id:${id}`).join(' OR '), 25)); }
      catch { failed += Math.min(25, ptcgIds.length - i); }
    }
    save();
    b.textContent = failed ? `Updated, ${failed} failed. Tap to retry` : '✓ Prices updated';
  } catch { b.textContent = 'Failed, tap to retry'; }
  b.disabled = false;
};

$('#export').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(col, null, 1)], { type: 'application/json' }));
  a.download = `card-vault-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
};
$('#import').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data) || !data.every(x => x.key && x.id && x.qty)) throw 0;
    col = data; save(); alert(`Loaded ${data.length} cards.`);
  } catch { alert('That file is not a Card Vault backup.'); }
};

// ---------- tabs ----------
function tab(which) {
  if (which !== 'scan') stopCam();
  $('#view-scan').hidden = which !== 'scan';
  $('#view-col').hidden = which !== 'col';
  $('#tab-scan').setAttribute('aria-selected', which === 'scan');
  $('#tab-col').setAttribute('aria-selected', which === 'col');
}
$('#tab-scan').onclick = () => tab('scan');
$('#tab-col').onclick = () => tab('col');
renderCol();
</script>
</body>
</html>
