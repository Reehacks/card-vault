<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Card Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap">
<style>
/* Layout: one column phone app, sticky header with two tabs, full-screen camera overlay */
:root{
  --bg:#f3f4f8; --card:#ffffff; --fg:#1b1f33; --muted:#646a85; --line:#dfe2ec;
  --accent:#2f5bd3; --accent-fg:#fff; --gold:#b8860b; --bad:#c0392b;
  --display:"Space Grotesk",system-ui,sans-serif; --body:Inter,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141f; --card:#1c1f2e; --fg:#e8eaf3; --muted:#9aa0bb; --line:#2c3044;
  --accent:#7d9cff; --accent-fg:#0c1020; --gold:#e6b84a; --bad:#ff7b6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141f; --card:#1c1f2e; --fg:#e8eaf3; --muted:#9aa0bb; --line:#2c3044;
  --accent:#7d9cff; --accent-fg:#0c1020; --gold:#e6b84a; --bad:#ff7b6b; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);
  padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
h1{font:700 20px var(--display);margin:0 0 8px}
nav{display:flex;gap:4px}
nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);
  font:600 15px var(--body);padding:10px 0;cursor:pointer}
nav button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
main{padding:16px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  max-width:640px;margin:0 auto;display:grid;gap:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-fg);
  border:0;border-radius:12px;font:600 16px var(--body);padding:14px;cursor:pointer;width:100%}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.btn.small{width:auto;padding:8px 12px;font-size:14px;border-radius:9px}
.link{background:none;border:0;color:var(--accent);font:600 14px var(--body);cursor:pointer;text-align:center;padding:4px}
button:focus-visible,input:focus-visible,label:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
input[type=search]{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--fg);font:15px var(--body)}
#preview{max-height:220px;border-radius:12px;display:block;margin:0 auto}
#status{color:var(--muted);text-align:center;min-height:1.4em;margin:0}
.hint{color:var(--muted);font-size:13px;margin:0;text-align:center}
.item{display:grid;grid-template-columns:64px 1fr;gap:12px;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:10px}
.item img{width:64px;border-radius:5px}
.item h3{font:700 16px var(--display);margin:0}
.meta{color:var(--muted);font-size:13px}
.variants{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.price{font-variant-numeric:tabular-nums;font-weight:600}
.eur{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.total{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
  display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.total b{font:700 28px var(--display);color:var(--gold);font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;gap:6px;margin-top:6px}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);
  color:var(--fg);font-size:18px;cursor:pointer}
.qty .del{width:auto;padding:0 10px;font-size:13px;color:var(--bad);margin-left:auto}
.empty{text-align:center;color:var(--muted);padding:32px 8px}
a{color:var(--accent)}
.qty .sellb{width:auto;padding:0 10px;font-size:13px;color:var(--accent);margin-left:auto}
.qty .sellb+.del{margin-left:0}
/* sell form */
#sell{width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 32px);border:1px solid var(--line);border-radius:16px;
  background:var(--card);color:var(--fg);padding:16px}
#sell::backdrop{background:rgba(0,0,0,.5)}
#sell form{display:grid;gap:12px}
#sell h3{font:700 18px var(--display);margin:0}
#sell h4{font:700 15px var(--display);margin:0}
#sell section{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
#sell label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
#sell input,#sell select,#sell textarea{width:100%;padding:9px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg);color:var(--fg);font:14px var(--body)}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shots img{width:100%;aspect-ratio:63/88;object-fit:cover;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
#tOut{margin:0;min-height:1.4em}
#tOut.bad{color:var(--bad)}
/* camera overlay: always dark, it shows a live camera */
#cam{position:fixed;inset:0;z-index:20;background:#000;overflow:hidden}
#video{width:100%;height:100%;object-fit:cover;display:block}
#guide{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
  width:min(74vw,50vh);aspect-ratio:63/88;border:3px solid #fff;border-radius:16px;
  box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
#guide::after{content:"";position:absolute;left:-3px;right:-3px;bottom:-3px;height:20%;
  border:3px dashed #ffd84a;border-radius:0 0 16px 16px}
#guide.hit{border-color:#5be07a}
#camStatus{position:absolute;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));
  margin:0;color:#fff;text-align:center;font:600 16px var(--body);text-shadow:0 1px 3px #000}
#camClose{position:absolute;left:50%;transform:translateX(-50%);width:auto;padding:12px 28px;
  bottom:calc(28px + env(safe-area-inset-bottom,0px));background:#fff;color:#111;border:0}
</style>
</head>
<body>
<header>
  <h1>Card Vault</h1>
  <nav role="tablist">
    <button id="tab-scan" role="tab" aria-selected="true">Scan</button>
    <button id="tab-col" role="tab" aria-selected="false">Collection <span id="count"></span></button>
  </nav>
</header>

<main id="view-scan">
  <button class="btn" id="scan">📷 Scan a card</button>
  <label class="link" for="photo">Use a photo instead</label>
  <input id="photo" type="file" accept="image/*" capture="environment" hidden>
  <img id="preview" alt="" hidden>
  <p id="status" aria-live="polite"></p>
  <form id="search" class="row">
    <input id="q" type="search" placeholder="Or type: Pikachu  or  25/165" autocomplete="off">
    <button class="btn small" style="flex:0 0 auto">Find</button>
  </form>
  <div id="results" style="display:grid;gap:10px"></div>
</main>

<main id="view-col" hidden>
  <div class="total">
    <div><div class="meta">Collection value (TCGplayer market)</div><b id="sum-usd">$0.00</b></div>
    <div class="eur" id="sum-eur"></div>
  </div>
  <div class="row">
    <button class="btn ghost small" id="refresh">↻ Update prices</button>
    <button class="btn ghost small" id="export">Save backup</button>
    <label class="btn ghost small" for="import">Load backup</label>
    <input id="import" type="file" accept="application/json,.json" hidden>
  </div>
  <div id="list" style="display:grid;gap:10px"></div>
</main>

<dialog id="sell">
  <form onsubmit="return false">
    <h3 id="sTitle"></h3>
    <label id="copyRow" hidden>Which copy <select id="tCopy"></select></label>
    <div class="shots">
      <label>Front <img id="fImg" alt=""><input id="fIn" type="file" accept="image/*" capture="environment"></label>
      <label>Back <img id="bImg" alt=""><input id="bIn" type="file" accept="image/*" capture="environment"></label>
    </div>
    <label>Title <input id="tTitle" maxlength="80"></label>
    <label>Text <textarea id="tDesc" rows="4"></textarea></label>
    <section>
      <h4>Tradera</h4>
      <p class="meta" id="trState"></p>
      <div id="trFields" hidden style="display:grid;gap:8px">
        <label>Category <select id="tCat"></select></label>
        <div id="tAttrs" style="display:grid;gap:8px"></div>
        <div class="row">
          <label>Type <select id="tType"><option value="1">Auction</option><option value="3">Buy now only</option></select></label>
          <label>Price (kr) <input id="tPrice" type="number" min="1" inputmode="numeric"></label>
          <label>Days <input id="tDays" type="number" min="1" value="7" inputmode="numeric"></label>
        </div>
        <p class="meta" id="tHint"></p>
        <label>Buyers <select id="tBidder"><option value="1">Sweden only</option><option value="4">EU</option><option value="3">Whole world</option></select></label>
        <label>Shipping <select id="tShip"></select></label>
        <div class="row">
          <button type="button" class="btn small ghost" id="tCheck">Check only</button>
          <button type="button" class="btn small" id="tPost">Post on Tradera</button>
        </div>
        <p id="tOut" aria-live="polite"></p>
      </div>
    </section>
    <section>
      <h4>Cardmarket</h4>
      <p class="meta" id="cmInfo"></p>
      <div class="row">
        <button type="button" class="btn small ghost" id="cmCopy">Copy text</button>
        <button type="button" class="btn small ghost" id="cmOpen">Open on Cardmarket</button>
      </div>
    </section>
    <button type="button" class="btn ghost" onclick="this.closest('dialog').close()">Close</button>
  </form>
</dialog>

<div id="cam" hidden>
  <video id="video" playsinline muted autoplay></video>
  <div id="guide"></div>
  <p id="camStatus" aria-live="polite"></p>
  <button id="camClose" class="btn">Cancel</button>
</div>

<script>
// Two free price sources. TCGdex first (fresh prices, stable), pokemontcg.io as backup.
const DEX = 'https://api.tcgdex.net/v2/en';
const PTCG = 'https://api.pokemontcg.io/v2/cards';
const PTCG_FIELDS = 'id,name,number,set,images,tcgplayer,cardmarket';
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const usd = n => n == null ? '–' : '$' + n.toFixed(2);
const eur = n => n == null ? '–' : '€' + n.toFixed(2);
const pretty = k => k.replace(/-/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2').replace(/^./, c => c.toUpperCase());
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip0 = n => /^\d+$/.test(n) ? String(+n) : n;

// ---------- storage (on this phone) ----------
let col = [];
try { col = JSON.parse(localStorage.getItem('vault') || '[]'); } catch {}
function save() {
  try { localStorage.setItem('vault', JSON.stringify(col)); } catch { alert('Could not save. Is private mode on?'); }
  renderCol();
}

// ---------- network: timeout + retry, 404 = null ----------
async function getJSON(url, tries = 3) {
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(url, { signal: AbortSignal.timeout(10000) });
      if (r.ok) return await r.json();
      if (r.status === 404) return null;
      if (r.status < 500 && r.status !== 429) throw new Error('HTTP ' + r.status);
    } catch (e) { if (String(e.message).startsWith('HTTP')) throw e; }
    if (i < tries - 1) await sleep(800 * (i + 1));
  }
  throw new Error('no answer from ' + new URL(url).host);
}

// ---------- both sources -> one card shape ----------
// {src, id, name, set, no, img, variants:[{v, usd, eur}]}
function fromDex(c) {
  const tp = c.pricing?.tcgplayer || {}, cm = c.pricing?.cardmarket || {};
  const eurFor = k => (/reverse/.test(k) ? cm['trend-holo'] : cm.trend) || cm.avg || null;
  const keys = Object.keys(tp).filter(k => tp[k] && typeof tp[k] === 'object');
  return { src: 'dex', id: c.id, name: c.name, set: c.set.name,
    no: c.set.cardCount?.official ? `${c.localId}/${c.set.cardCount.official}` : c.localId,
    img: c.image ? c.image + '/low.webp' : '',
    variants: keys.length
      ? keys.map(k => ({ v: k, usd: tp[k].marketPrice ?? tp[k].midPrice ?? null, eur: eurFor(k) }))
      : [{ v: 'normal', usd: null, eur: eurFor('normal') }] };
}
function fromPtcg(c) {
  const tp = c.tcgplayer?.prices || {}, cm = c.cardmarket?.prices || {};
  const eurFor = k => (/reverse/i.test(k) ? cm.reverseHoloTrend : cm.trendPrice) || null;
  const keys = Object.keys(tp);
  return { src: 'ptcg', id: c.id, name: c.name, set: c.set.name,
    no: c.set.printedTotal ? `${c.number}/${c.set.printedTotal}` : c.number,
    img: c.images.small,
    variants: keys.length
      ? keys.map(k => ({ v: k, usd: tp[k].market ?? tp[k].mid ?? null, eur: eurFor(k) }))
      : [{ v: 'normal', usd: null, eur: eurFor('normal') }] };
}

const dexFull = async ids => (await Promise.all(ids.map(id => getJSON(`${DEX}/cards/${encodeURIComponent(id)}`).catch(() => null))))
  .filter(Boolean).map(fromDex);
const ptcgSearch = async (q, size = 30) =>
  (await getJSON(`${PTCG}?q=${encodeURIComponent(q)}&pageSize=${size}&orderBy=-set.releaseDate&select=${PTCG_FIELDS}`)).data.map(fromPtcg);

async function dexByNum(p) {
  if (/^\d+$/.test(p.num) && /^\d+$/.test(p.total)) {
    const sets = await getJSON(`${DEX}/sets?cardCount.official=eq:${+p.total}`) || [];
    const cards = await Promise.all(sets.map(s => getJSON(`${DEX}/sets/${s.id}/${strip0(p.num)}`).catch(() => null)));
    return cards.filter(Boolean).map(fromDex);
  }
  const brief = await getJSON(`${DEX}/cards?localId=eq:${encodeURIComponent(p.num)}`) || [];
  return dexFull(brief.slice(0, 12).map(c => c.id));
}
async function dexByName(t) {
  const brief = await getJSON(`${DEX}/cards?name=${encodeURIComponent(t)}&pagination:itemsPerPage=12`) || [];
  return dexFull(brief.map(c => c.id));
}
function ptcgNumQuery(p) {
  let q = `number:"${strip0(p.num)}"`;
  if (/^\d+$/.test(p.total)) q += ` set.printedTotal:${+p.total}`;
  return q;
}

// Try TCGdex; if it fails or finds nothing, try pokemontcg.io.
async function lookup(dexFn, ptcgQ) {
  let dexErr;
  try { const r = await dexFn(); if (r.length) return r; } catch (e) { dexErr = e; }
  try { return await ptcgSearch(ptcgQ); }
  catch (e) { if (dexErr) throw new Error('Both price sites are not answering. Try again in a minute.'); return []; }
}
const findByNum = p => lookup(() => dexByNum(p), ptcgNumQuery(p));
const findByName = t => lookup(() => dexByName(t), `name:"${t}*"`);

// ---------- card number parsing ----------
// "025/165" -> {num:"025", total:"165"}; also "TG05/TG30", "SV049/SV122"
function parseNum(text) {
  const m = text.toUpperCase().match(/([A-Z]{0,3}\d{1,3})\s*\/\s*([A-Z]{0,3}\d{2,3})/);
  if (!m) return null;
  // real prefixes are on both sides (TG05/TG30); a letter only on the left is the regulation mark ("D 044/185")
  return { num: /^\d+$/.test(m[2]) ? m[1].replace(/^[A-Z]+/, '') : m[1], total: m[2] };
}

// ---------- OCR ----------
// PaddleOCR (PP-OCRv6 tiny) reads small text far better than Tesseract and gives a score per line.
// Tesseract stays as a fallback if PaddleOCR cannot load. reader(canvases) -> [{text, score}]
let readerP = null;
function loadReader() {
  return readerP ??= (async () => {
    try {
      const { PaddleOCR } = await import('https://cdn.jsdelivr.net/npm/@paddleocr/paddleocr-js@0.4.2/+esm');
      const o = await PaddleOCR.create({ textDetectionModelName: 'PP-OCRv6_tiny_det',
        textRecognitionModelName: 'PP-OCRv6_tiny_rec', ortOptions: { backend: 'wasm' } });
      return async imgs => (await o.predict(imgs)).flatMap(r => r.items);
    } catch (e) {
      console.warn('PaddleOCR failed, using Tesseract', e);
      await new Promise((ok, bad) => document.head.append(Object.assign(document.createElement('script'),
        { src: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js', onload: ok, onerror: bad })));
      const w = await Tesseract.createWorker('eng');
      return async imgs => { const out = [];
        for (const i of imgs) for (const l of (await w.recognize(i)).data.lines) out.push({ text: l.text, score: l.confidence / 100 });
        return out; };
    }
  })().catch(e => { readerP = null; throw e; });
}
// The number sits in a bottom corner: left on modern cards, right on old ones. Read only those two corners.
async function readCorners(src, sx, sy, sw, sh, minScore = 0.9) {
  const cw = sw * 0.5, scale = Math.min(2.5, 700 / cw);
  const crops = [sx, sx + sw - cw].map(x => {
    const c = document.createElement('canvas');
    c.width = cw * scale; c.height = sh * scale;
    c.getContext('2d').drawImage(src, x, sy, cw, sh, 0, 0, c.width, c.height);
    return c;
  });
  const read = await loadReader();
  for (const line of await read(crops)) {
    const p = line.score >= minScore && parseNum(line.text);
    if (p) return p;
  }
  return null;
}
loadReader().catch(() => {}); // start the download now, so the first scan is fast

// ---------- live camera scan ----------
let stream = null, scanning = false;
const camStatus = t => $('#camStatus').textContent = t;

// bottom part of the on-screen frame, mapped to video pixels (video uses object-fit: cover)
function stripRect() {
  const v = $('#video'), e = v.getBoundingClientRect(), g = $('#guide').getBoundingClientRect();
  const vw = v.videoWidth, vh = v.videoHeight;
  if (!vw) return null;
  const s = Math.max(e.width / vw, e.height / vh);
  const dx = (e.width - vw * s) / 2, dy = (e.height - vh * s) / 2;
  // generous margins: people never line the card up exactly
  const x0 = Math.max(0, (g.left - g.width * 0.12 - e.left - dx) / s);
  const x1 = Math.min(vw, (g.right + g.width * 0.12 - e.left - dx) / s);
  const y0 = Math.max(0, (g.bottom - g.height * 0.25 - e.top - dy) / s);
  const y1 = Math.min(vh, (g.bottom + g.height * 0.12 - e.top - dy) / s);
  return [x0, y0, x1 - x0, y1 - y0];
}

async function startCam() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false,
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } });
  } catch {
    return status('Camera not allowed. Allow camera for this site, or tap "Use a photo instead".');
  }
  try { await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch {}
  const v = $('#video');
  v.srcObject = stream;
  $('#cam').hidden = false; $('#guide').classList.remove('hit');
  $('#results').innerHTML = ''; $('#preview').hidden = true; status('');
  await v.play().catch(() => {});
  scanning = true;
  camStatus('Loading the reader (slow only the first time)…');
  try { await loadReader(); } catch { stopCam(); return status('Could not load the reader. Check your internet and try again.'); }
  const misses = new Set();
  camStatus('Put the card in the frame. Number in the yellow part.');
  while (scanning) {
    const r = stripRect();
    if (!r) { await sleep(200); continue; }
    const p = await readCorners(v, ...r);
    if (!scanning) break;
    const k = p && `${p.num}/${p.total}`;
    if (!k || misses.has(k)) { await sleep(50); continue; }
    camStatus(`Found ${k}. Getting price…`);
    $('#guide').classList.add('hit');
    try {
      const cards = await findByNum(p);
      if (!scanning) break;
      if (cards.length) {
        const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0); c.toBlob(b => lastPhoto = b, 'image/jpeg', 0.9);
        stopCam(); $('#q').value = k; showResults(cards); return;
      }
      misses.add(k); camStatus(`No card ${k}. Keep holding still…`);
    } catch (e) { camStatus(e.message); await sleep(1500); }
    $('#guide').classList.remove('hit');
  }
}
function stopCam() {
  scanning = false;
  stream?.getTracks().forEach(t => t.stop());
  stream = null;
  $('#video').srcObject = null;
  $('#cam').hidden = true;
}
$('#scan').onclick = startCam;
$('#camClose').onclick = stopCam;
document.addEventListener('visibilitychange', () => { if (document.hidden && scanning) stopCam(); });

// ---------- photo fallback ----------
$('#photo').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  lastPhoto = f;
  $('#preview').src = URL.createObjectURL(f); $('#preview').hidden = false;
  $('#results').innerHTML = '';
  try {
    const img = await createImageBitmap(f);
    status('Reading the card number…');
    const h = Math.round(img.height * 0.2);
    let p = await readCorners(img, 0, img.height - h, img.width, h, 0.7);
    if (!p) { status('Looking harder…'); p = await readCorners(img, 0, 0, img.width, img.height, 0.7); }
    if (!p) return status('Could not read the number. Try again, or type it below.');
    $('#q').value = `${p.num}/${p.total}`;
    status(`Found ${p.num}/${p.total}. Getting price…`);
    showResults(await findByNum(p));
  } catch (err) { status('Error: ' + err.message); }
};

// ---------- typed search ----------
$('#search').onsubmit = async e => {
  e.preventDefault();
  const t = $('#q').value.trim().replace(/"/g, '');
  if (!t) return;
  lastPhoto = null;
  $('#results').innerHTML = '';
  status('Searching…');
  try {
    const p = parseNum(t);
    showResults(p ? await findByNum(p) : await findByName(t));
  } catch (err) { status('Error: ' + err.message); }
};

function status(t) { $('#status').textContent = t; }

// ---------- results ----------
let shown = [];
function showResults(cards) {
  shown = cards;
  status(cards.length ? (cards.length > 1 ? 'Tap the version that matches your card:' : 'Tap your version to add it:') : 'No card found. Check the number and try again.');
  $('#results').innerHTML = cards.map((c, i) => `<div class="item"><img src="${esc(c.img)}" alt="" loading="lazy">
    <div><h3>${esc(c.name)}</h3>
    <div class="meta">${esc(c.set)} · ${esc(c.no)}</div>
    <div class="variants">${c.variants.map((x, j) =>
      `<button class="btn small" data-i="${i}" data-j="${j}">+ ${esc(pretty(x.v))} <span class="price">${x.usd != null ? usd(x.usd) : eur(x.eur)}</span></button>`).join('')}</div>
    </div></div>`).join('');
}

$('#results').onclick = e => {
  const b = e.target.closest('button[data-i]'); if (!b) return;
  const c = shown[b.dataset.i], x = c.variants[b.dataset.j], key = `${c.src}:${c.id}|${x.v}`;
  const have = col.find(it => it.key === key);
  if (have) have.qty++;
  else col.push({ key, src: c.src, id: c.id, variant: x.v, name: c.name, set: c.set, num: c.no,
    img: c.img, qty: 1, usd: x.usd, eur: x.eur });
  if (lastPhoto) photos[key] = lastPhoto; // kept in memory only, for the Sell form
  save();
  status(`Added ${c.name} (${pretty(x.v)}). Scan the next one!`);
  b.textContent = '✓ Added';
};

// ---------- collection ----------
function renderCol() {
  const n = col.reduce((s, x) => s + x.qty, 0);
  $('#count').textContent = n ? `(${n})` : '';
  $('#sum-usd').textContent = usd(col.reduce((s, x) => s + (x.usd || 0) * x.qty, 0));
  $('#sum-eur').textContent = 'Cardmarket ' + eur(col.reduce((s, x) => s + (x.eur || 0) * x.qty, 0));
  const sorted = [...col].sort((a, b) => (b.usd || 0) - (a.usd || 0));
  $('#list').innerHTML = sorted.length ? sorted.map(x => `<div class="item"><img src="${esc(x.img)}" alt="" loading="lazy">
    <div><h3>${esc(x.name)}</h3>
    <div class="meta">${esc(x.set)} · ${esc(x.num)} · ${esc(pretty(x.variant))}</div>
    <div><span class="price">${usd(x.usd)}</span> <span class="eur">· ${eur(x.eur)}</span>${x.posted ? ` <span class="eur">· ${Object.keys(x.posted).length} posted</span>` : ''}</div>
    <div class="qty"><button data-k="${esc(x.key)}" data-d="-1" aria-label="One less">−</button>
      <span class="price">×${x.qty}</span>
      <button data-k="${esc(x.key)}" data-d="1" aria-label="One more">+</button>
      <button class="sellb" data-k="${esc(x.key)}" data-d="sell">Sell</button>
      <button class="del" data-k="${esc(x.key)}" data-d="del">Remove</button></div></div></div>`).join('')
    : '<p class="empty">No cards yet. Go to Scan and add your first card.</p>';
}

let armed = null; // tap Remove twice to delete
$('#list').onclick = e => {
  const b = e.target.closest('button[data-k]'); if (!b) return;
  const x = col.find(c => c.key === b.dataset.k); if (!x) return;
  if (b.dataset.d === 'sell') return openSell(x);
  if (b.dataset.d === 'del') {
    if (armed !== x.key) { armed = x.key; b.textContent = 'Tap again to remove'; return; }
    col = col.filter(c => c !== x);
  } else {
    x.qty = Math.max(1, x.qty + +b.dataset.d);
  }
  armed = null; save();
};

$('#refresh').onclick = async () => {
  const b = $('#refresh'); b.disabled = true;
  const srcOf = x => x.src || 'ptcg'; // cards saved by the first version have no src
  const apply = cards => { for (const c of cards) for (const x of col) {
    if (x.id !== c.id || srcOf(x) !== c.src) continue;
    const v = c.variants.find(v => v.v === x.variant);
    if (v) { x.usd = v.usd; x.eur = v.eur; }
  } };
  let failed = 0;
  try {
    const dexIds = [...new Set(col.filter(x => srcOf(x) === 'dex').map(x => x.id))];
    const ptcgIds = [...new Set(col.filter(x => srcOf(x) === 'ptcg').map(x => x.id))];
    const all = dexIds.length + ptcgIds.length;
    for (let i = 0; i < dexIds.length; i += 6) {
      b.textContent = `Updating ${i}/${all}…`;
      const part = dexIds.slice(i, i + 6), got = await dexFull(part);
      failed += part.length - got.length; apply(got);
    }
    for (let i = 0; i < ptcgIds.length; i += 25) {
      b.textContent = `Updating ${dexIds.length + i}/${all}…`;
      try { apply(await ptcgSearch(ptcgIds.slice(i, i + 25).map(id => `id:${id}`).join(' OR '), 25)); }
      catch { failed += Math.min(25, ptcgIds.length - i); }
    }
    save();
    b.textContent = failed ? `Updated, ${failed} failed. Tap to retry` : '✓ Prices updated';
  } catch { b.textContent = 'Failed, tap to retry'; }
  b.disabled = false;
};

$('#export').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(col, null, 1)], { type: 'application/json' }));
  a.download = `card-vault-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
};
$('#import').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data) || !data.every(x => x.key && x.id && x.qty)) throw 0;
    col = data; save(); alert(`Loaded ${data.length} cards.`);
  } catch { alert('That file is not a Card Vault backup.'); }
};

// ---------- sell: Tradera (through poster.py on a PC) and Cardmarket helper ----------
let lastPhoto = null, selling = null, sellImgs = {}, sellInfo = {}, copyN = 1;
const sellKey = () => `${selling.key}#${copyN}`; // photos are kept per copy
const photos = {}; // scan photo per collection key, in memory only
let vaultKey = new URLSearchParams(location.search).get('k'); // secret code from the poster.py link
try { vaultKey ? localStorage.setItem('vaultKey', vaultKey) : vaultKey = localStorage.getItem('vaultKey'); } catch {}
const tr = async (path, opt = {}) => {
  const r = await fetch('/api/tradera/' + path, { ...opt, headers: { 'X-Vault': vaultKey || '', 'Content-Type': 'application/json' } });
  const t = await r.text(); let d; try { d = JSON.parse(t); } catch { d = t; }
  if (!r.ok) throw new Error(`Tradera said ${r.status}: ${typeof d === 'string' ? d : JSON.stringify(d)}`.slice(0, 400));
  return d;
};
let sekRate, cats, shipFor = {}, priceTouched = false;
const posterStatus = () => fetch('/api/status').then(r => r.ok ? r.json() : false).catch(() => false);
const getSek = async () => sekRate ??= (await getJSON('https://api.frankfurter.dev/v1/latest?from=EUR&to=SEK').catch(() => null))?.rates?.SEK || 11;
async function pokemonCats() {
  if (cats) return cats;
  const out = [], walk = (n, path, pk) => {
    const p = [...path, n.name]; pk ||= /pok[eé]mon/i.test(n.name);
    if (n.childCategories?.length) n.childCategories.forEach(c => walk(c, p, pk));
    else if (pk) out.push({ id: n.id, name: p.join(' › ') });
  };
  (await tr('categories')).forEach(n => walk(n, [], false));
  return cats = out;
}
async function cardInfo(x) {
  if ((x.src || 'ptcg') === 'dex') {
    const c = await getJSON(`${DEX}/cards/${encodeURIComponent(x.id)}`);
    const s = c?.set?.id && await getJSON(`${DEX}/sets/${c.set.id}`);
    return { rarity: c?.rarity, serie: s?.serie?.name, year: s?.releaseDate?.slice(0, 4), local: c?.localId };
  }
  const c = (await getJSON(`${PTCG}/${encodeURIComponent(x.id)}`))?.data;
  return { rarity: c?.rarity, serie: c?.set?.series, year: c?.set?.releaseDate?.slice(0, 4), local: c?.number };
}
const bare = s => s.toLowerCase().replace(/and|[^a-z0-9]/g, '');
function listingText(x, i) {
  const no = String(i.local ?? x.num.split('/')[0]).replace(/^0+(?=\d)/, '');
  const set = x.set + (i.serie && bare(i.serie) !== bare(x.set) ? ' - ' + i.serie : '');
  return {
    title: `Pokémon ${x.name} #${no} ${x.set}${i.year ? ' ' + i.year : ''}`.slice(0, 80),
    desc: [`${x.name} #${no} från setet ${set}${i.year ? ' som släpptes år ' + i.year : ''}`,
      i.rarity && `Raritet: ${i.rarity}`,
      x.variant !== 'normal' && `Version: ${pretty(x.variant)}`,
      'Språk: Engelska'].filter(Boolean).join('\n'),
  };
}
const idb = new Promise((ok, no) => { const r = indexedDB.open('vault-photos', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('p'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const shots = (mode, fn) => idb.then(db => new Promise((ok, no) => {
  const q = fn(db.transaction('p', mode).objectStore('p')); q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error); }));
const setShot = (side, src) => {
  sellImgs[side] = src; const im = $(side === 'f' ? '#fImg' : '#bImg');
  if (src) im.src = src instanceof Blob ? URL.createObjectURL(src) : src; else im.removeAttribute('src');
};
for (const side of ['f', 'b']) $(`#${side}In`).onchange = async e => {
  const f = e.target.files[0], k = selling && sellKey(); e.target.value = ''; if (!f || !k) return;
  const b = await shrink(f), cur = k === sellKey(); // the picker may have moved to another copy meanwhile
  const prev = cur ? sellImgs : await shots('readonly', st => st.get(k)).catch(() => null) || {};
  if (cur) setShot(side, b);
  shots('readwrite', st => st.put({ ...prev, [side]: b }, k)).catch(() => {});
};
async function loadShots() {
  const x = selling, k = sellKey();
  const saved = await shots('readonly', st => st.get(k)).catch(() => null) || {};
  if (k !== sellKey()) return;
  setShot('f', saved.f || (copyN === 1 && photos[x.key]) || x.img.replace('/low.webp', '/high.webp'));
  setShot('b', saved.b || null);
  const id = x.posted?.[copyN];
  tOut(id ? `This copy is already posted (item ${id}).` : '');
  $('#tPost').textContent = id ? 'Post again on Tradera' : 'Post on Tradera';
}
function fillCopies() {
  const x = selling;
  $('#copyRow').hidden = x.qty < 2;
  $('#tCopy').innerHTML = Array.from({ length: x.qty }, (_, i) =>
    `<option value="${i + 1}">Copy ${i + 1} of ${x.qty}${x.posted?.[i + 1] ? ' · Posted' : ''}</option>`).join('');
  $('#tCopy').value = copyN;
}
$('#tCopy').onchange = () => { copyN = +$('#tCopy').value; loadShots(); };
const tOut = (t, bad) => { $('#tOut').textContent = t; $('#tOut').className = bad ? 'bad' : ''; };

async function openSell(x) {
  selling = x; sellImgs = {}; priceTouched = false;
  copyN = Array.from({ length: x.qty }, (_, i) => i + 1).find(n => !x.posted?.[n]) || 1; // first copy not posted yet
  $('#sTitle').textContent = `Sell ${x.name} · ${x.num}`;
  fillCopies(); await loadShots();
  $('#tTitle').value = `Pokémon ${x.name}`; $('#tDesc').value = 'Getting card details…';
  $('#cmInfo').textContent = `Cardmarket trend: ${eur(x.eur)}. On Cardmarket, find the card, then tap Sell.`;
  $('#sell').showModal();
  sellInfo = await cardInfo(x).catch(() => ({}));
  const t = listingText(x, sellInfo);
  if (selling !== x) return;
  $('#tTitle').value = t.title; $('#tDesc').value = t.desc;
  const st = await posterStatus();
  $('#trFields').hidden = !st?.loggedIn;
  $('#trState').innerHTML = !st ? 'To post on Tradera: run <b>python poster.py</b> on your PC. On the phone, open the phone link it shows (this page cannot post).'
    : !st.loggedIn ? (location.hostname === 'localhost' ? '<a href="/api/login">Log in to Tradera</a>, then open Sell again.' : 'Log in to Tradera on your PC first (run poster.py there).')
    : st.phoneUrl ? `Phone link (same Wi-Fi): <b>${esc(st.phoneUrl)}</b>` : '';
  if (!st?.loggedIn) return;
  try {
    const list = await pokemonCats(), keep = localStorage.getItem('trCat') || list.find(c => /singles/i.test(c.name))?.id;
    $('#tCat').innerHTML = list.map(c => `<option value="${c.id}" ${c.id == keep ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
    await catChanged();
  } catch (e) { tOut(e.message, true); }
}

async function catChanged() {
  const x = selling, cat = $('#tCat').value;
  try { localStorage.setItem('trCat', cat); } catch {}
  const defs = await tr(`categories/${cat}/attribute-definitions`);
  $('#tAttrs').innerHTML = defs.filter(d => d.possibleTermValues?.length).map(d =>
    `<label>${esc(d.name)} <select data-attr="${d.id}">${d.minNumberOfValues ? '' : '<option value="">–</option>'}
    ${d.possibleTermValues.map(v => `<option>${esc(v)}</option>`).join('')}</select></label>`).join('');
  // pre-fill: set name, language, condition, then era by series name or release year
  const i = sellInfo || {}, want = [x.set, 'Engelska', 'Mycket gott skick'].map(bare);
  for (const s of document.querySelectorAll('[data-attr]')) {
    const opts = [...s.options].map(o => o.value).filter(Boolean);
    const hit = opts.find(v => want.includes(bare(v)))
      || (i.serie && opts.find(v => bare(v).startsWith(bare(i.serie))))
      || (i.year && opts.find(v => { const m = v.match(/(\d{4})(?:-(\d{4}))?$/); return m && +i.year >= +m[1] && +i.year <= +(m[2] || m[1]); }));
    if (hit) s.value = hit;
  }
  shipFor[cat] ??= [...new Map((await tr(`reference-data/shipping-options?fromCountryCodes=SE&categoryIds=${cat}`))
    .productsPerWeightSpan.flatMap(s => s.products).filter(p => p.name && p.weight > 0).map(p => [`${p.shippingProviderId}:${p.id}`, p])).values()]
    .sort((a, b) => a.weight - b.weight || a.price - b.price);
  $('#tShip').innerHTML = shipFor[cat].map((p, i) =>
    `<option value="${i}">${esc(p.shippingProvider)} ${esc(p.name)} · ${p.weight} kg · ${p.price} kr</option>`).join('');
  const sek = x.eur != null ? x.eur * await getSek() : null;
  const fill = v => { if (!priceTouched) $('#tPrice').value = Math.max(1, Math.round(v)); };
  fill(sek ?? 10);
  let hint = sek != null ? `Cardmarket ${eur(x.eur)} ≈ ${Math.round(sek)} kr.` : '', sold;
  try {
    const s = await tr(`pricing/suggestion?query=${encodeURIComponent(`${x.name} ${x.set}`.slice(0, 100))}&categoryId=${cat}`);
    if (s.suggested) { sold = s.suggested; hint += ` Sold on Tradera: about ${s.suggested} kr (${s.low}–${s.high} kr).`; }
  } catch {}
  $('#tHint').textContent = hint;
  if (sold) fill(sold);
}
$('#tPrice').oninput = () => priceTouched = true;
$('#tCat').onchange = () => catChanged().catch(e => tOut(e.message, true));
$('#tType').onchange = () => { if ($('#tType').value === '3' && +$('#tDays').value < 30) $('#tDays').value = 30; };

async function shrink(src) { // any image -> JPEG blob, max 1600 px
  const b = src instanceof Blob ? src : await (await fetch(src)).blob();
  const im = await createImageBitmap(b), s = Math.min(1, 1600 / Math.max(im.width, im.height));
  const c = document.createElement('canvas'); c.width = im.width * s | 0; c.height = im.height * s | 0;
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
}
async function jpeg64(src) {
  const u = new Uint8Array(await (await shrink(src)).arrayBuffer()); let s = '';
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000));
  return btoa(s);
}

async function postTradera(commit) {
  const x = selling, n = copyN, imgs = { ...sellImgs }; // the copy being posted, even if the picker changes meanwhile
  const price = Math.round(+$('#tPrice').value), type = +$('#tType').value, ship = shipFor[$('#tCat').value]?.[$('#tShip').value];
  if (!(price >= 1)) return tOut('Set a price of 1 kr or more.', true);
  const body = {
    title: $('#tTitle').value.trim(), description: $('#tDesc').value.trim(),
    categoryId: +$('#tCat').value, itemType: type, duration: +$('#tDays').value, restarts: 0, acceptedBidderId: +$('#tBidder').value,
    startPrice: price, ...(type === 3 && { buyItNowPrice: price }), autoCommit: false,
    attributeValues: { terms: [...document.querySelectorAll('[data-attr]')].filter(s => s.value)
      .map(s => ({ id: +s.dataset.attr, values: [s.value] })) },
    ...(ship && { shippingOptions: [{ shippingProviderId: ship.shippingProviderId, shippingProductId: ship.id,
      cost: ship.price, shippingWeight: ship.weight }] }),
  };
  $('#tCheck').disabled = $('#tPost').disabled = true;
  try {
    tOut(commit ? 'Sending to Tradera…' : 'Checking with Tradera…');
    const q = await tr('listings/items', { method: 'POST', body: JSON.stringify(body) });
    if (!commit) return tOut('✓ Tradera accepts this listing. Nothing is posted yet.');
    for (const side of ['f', 'b']) if (imgs[side]) {
      tOut(`Uploading ${side === 'f' ? 'front' : 'back'} photo…`);
      await tr(`listings/items/${q.requestId}/images`, { method: 'POST',
        body: JSON.stringify({ imageData: await jpeg64(imgs[side]), imageFormat: 1, hasMega: true }) });
    }
    await tr(`listings/items/${q.requestId}/commit`, { method: 'POST' });
    for (let i = 0; i < 30; i++) {
      await sleep(2000);
      const r = (await tr(`listings/request-results?requestIds=${q.requestId}`))[0];
      if (!r || r.resultCode === 128 || r.resultCode === 256) { tOut('Tradera is working on it…'); continue; }
      if (r.resultCode === 1) {
        (x.posted ||= {})[n] = q.itemId; save(); if (selling === x) fillCopies();
        if (copyN === n) $('#tPost').textContent = 'Post again on Tradera';
        return tOut(`✓ Copy ${n} posted on Tradera (item ${q.itemId}). See it under My Tradera › Selling.`);
      }
      return tOut(`Tradera said no (code ${r.resultCode}): ${r.message || ''}`, true);
    }
    tOut(`Sent (item ${q.itemId}). Tradera is slow. Check My Tradera in a few minutes.`);
  } catch (e) { tOut(e.message, true); }
  finally { $('#tCheck').disabled = $('#tPost').disabled = false; }
}
$('#tCheck').onclick = () => postTradera(false);
$('#tPost').onclick = () => postTradera(true);

$('#cmCopy').onclick = async () => {
  try { await navigator.clipboard.writeText($('#tDesc').value); $('#cmCopy').textContent = '✓ Copied'; }
  catch { $('#tDesc').select(); $('#cmCopy').textContent = 'Text selected. Copy it'; }
};
$('#cmOpen').onclick = () => open(`https://www.cardmarket.com/en/Pokemon/Products/Search?searchString=${encodeURIComponent(selling.name)}`, '_blank', 'noopener');

// ---------- tabs ----------
function tab(which) {
  if (which !== 'scan') stopCam();
  $('#view-scan').hidden = which !== 'scan';
  $('#view-col').hidden = which !== 'col';
  $('#tab-scan').setAttribute('aria-selected', which === 'scan');
  $('#tab-col').setAttribute('aria-selected', which === 'col');
}
$('#tab-scan').onclick = () => tab('scan');
$('#tab-col').onclick = () => tab('col');
renderCol();
</script>
